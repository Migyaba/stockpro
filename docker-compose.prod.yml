services:
  db:
    image: postgres:16-alpine
    container_name: stockpro-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockpro}
      POSTGRES_USER: ${POSTGRES_USER:-stockpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Veuillez definir POSTGRES_PASSWORD dans .env.prod}
    volumes:
      - stockpro_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockpro} -d ${POSTGRES_DB:-stockpro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stockpro-net

  minio:
    image: minio/minio:latest
    container_name: stockpro-minio-prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Veuillez definir MINIO_ROOT_USER dans .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Veuillez definir MINIO_ROOT_PASSWORD dans .env.prod}
    volumes:
      - stockpro_minio_data:/data
    ports:
      # Console d'administration Web de MinIO
      - "9001:9001"
    networks:
      - stockpro-net

  minio-init:
    image: minio/mc:latest
    container_name: stockpro-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/$${MINIO_BUCKET_NAME:-stockpro-media} --ignore-existing;
      /usr/bin/mc anonymous set download myminio/$${MINIO_BUCKET_NAME:-stockpro-media};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-stockpro-media}
    networks:
      - stockpro-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: stockpro-backend-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Veuillez definir DJANGO_SECRET_KEY dans .env.prod}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-stockpro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stockpro}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,https://localhost}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-14}
      USE_MINIO: "true"
      MINIO_ENDPOINT_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-stockpro-media}
      ALPHAPAY_SECRET_KEY: ${ALPHAPAY_SECRET_KEY:-}
      ALPHAPAY_WEBHOOK_SECRET: ${ALPHAPAY_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://stockpro.miguelmissetcho.com}
    volumes:
      - stockpro_static_prod:/app/staticfiles
    networks:
      - stockpro-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: stockpro-frontend-prod
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - stockpro-net

  nginx:
    image: nginx:alpine
    container_name: stockpro-nginx-prod
    restart: always
    depends_on:
      - backend
      - frontend
      - minio
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - stockpro_static_prod:/app/staticfiles:ro
    networks:
      - stockpro-net

volumes:
  stockpro_pgdata_prod:
  stockpro_minio_data:
  stockpro_static_prod:

networks:
  stockpro-net:
    driver: bridge
