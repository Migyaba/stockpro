services:
  db:
    image: postgres:16-alpine
    container_name: stockpro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockpro}
      POSTGRES_USER: ${POSTGRES_USER:-stockpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpro}
    ports:
      - "5433:5432"
    volumes:
      - stockpro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockpro-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-stockpro-dev-change-me-use-a-long-random-secret-key-32chars}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,0.0.0.0}
      DATABASE_URL: postgres://${POSTGRES_USER:-stockpro}:${POSTGRES_PASSWORD:-stockpro}@db:5432/${POSTGRES_DB:-stockpro}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-14}
      ALPHAPAY_SECRET_KEY: ${ALPHAPAY_SECRET_KEY:-}
      ALPHAPAY_WEBHOOK_SECRET: ${ALPHAPAY_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - stockpro_media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockpro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  stockpro_pgdata:
  stockpro_media:
