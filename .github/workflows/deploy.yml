name: CI/CD - Build, Push and Deploy

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/stockpro-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/stockpro-frontend

jobs:
  build-and-push:
    name: 1. Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/stockpro-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/stockpro-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://apistockpro.miguelmissetcho.com
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/stockpro-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/stockpro-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 2. Deploy to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute remote deployment commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Connexion SSH établie au VPS. Début du déploiement..."
            cd ~/apps/stockpro

            echo "📦 Téléchargement des nouvelles images depuis GHCR..."
            docker compose pull stockpro-backend stockpro-frontend

            echo "🔄 Redémarrage des conteneurs avec la nouvelle version..."
            docker compose up -d stockpro-backend stockpro-frontend

            echo "🧹 Nettoyage des anciennes images Docker orphelines..."
            docker image prune -f

            echo "🎉 Déploiement automatique terminé avec succès !"
